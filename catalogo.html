<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo · Distribuidora Pueyrredón</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://distribuidora-pueyrredon.github.io/catalogo/">
<meta http-equiv="refresh" content="0; url=catalogo/">
<script>
// El catálogo se mudó a catalogo/ y sale de la planilla. Los links viejos con #r=<rubro> o #q=<búsqueda> abren ese rubro o esa búsqueda.
var rubros={"reflectores": "Reflectores y proyectores", "lamparas": "Lámparas LED", "vintage": "Vintage, filamento y guirnaldas", "plafones": "Plafones, paneles y spots", "apliques": "Apliques interior y exterior", "tubos": "Tubos, listones y bajo mesada", "tiras": "Tiras LED, neón flex y controladores", "industrial": "Industrial y alumbrado", "emergencia": "Emergencia y linternas", "cables": "Cables", "canalizacion": "Cajas, caños y canalización", "llaves": "Llaves, tomas y fichas", "armado": "Portalámparas y armado de artefactos", "proteccion": "Tableros y protección", "hogar": "Hogar, climatización y repuestos", "herramientas": "Herramientas y medición", "fijacion": "Terminales, cintas y fijación"};
var r=(location.hash.match(/r=([a-z]+)/)||[])[1],q=(location.hash.match(/q=([^&]*)/)||[])[1];
location.replace('catalogo/'+(rubros[r]?'?cat='+encodeURIComponent(rubros[r]):q?'?q='+q:''));
</script>
</head>
<body><p><a href="catalogo/">Ir al catálogo</a></p></body>
</html>
